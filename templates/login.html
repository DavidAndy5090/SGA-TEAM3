{% extends 'base.html' %}
{% block title %}Login - Pool Estrada{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
  <div class="card shadow p-4" style="width: 380px;">
    <div class="text-center mb-4">
      <h4 class="fw-bold text-primary">🚌 Inversiones Pool Estrada</h4>
      <p class="text-muted small">Sistema de Gestión de Pasajes</p>
    </div>
    <form>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" placeholder="Ingresa tu usuario">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
